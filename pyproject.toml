[project]
name = "hello-fastapi"
version = "0.1.0"
description = "A FastAPI HTTP service scaffold managed with uv"
readme = "README.md"
authors = [
    { name = "chen041", email = "double_cl@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.uv]
package = false  # HTTP service application: run via uvicorn, no build/install

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["app", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=app --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
